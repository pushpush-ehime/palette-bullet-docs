name: Notify Discord on Notion task completion

on:
  # 日本時間08:30〜22:30の間、1時間に1回確認する。
  # GitHub ActionsのcronはUTCなので、08:30 JSTを前日の23:30 UTCとして分ける。
  # 手動実行が深夜になっても、スクリプト側の判定で通知を送らない。
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 0-13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-discord-completion-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Notify completed Notion tasks to Discord
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASK_DB_ID: ${{ secrets.NOTION_TASK_DB_ID }}
          DISCORD_TASK_WEBHOOK_URL: ${{ secrets.DISCORD_TASK_WEBHOOK_URL }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_TASK_DB_ID" ] || [ -z "$DISCORD_TASK_WEBHOOK_URL" ]; then
            echo "::error::NOTION_TOKEN / NOTION_TASK_DB_ID / DISCORD_TASK_WEBHOOK_URL のいずれかが未設定です。"
            exit 1
          fi

          node scripts/notion-completion-notify.mjs
